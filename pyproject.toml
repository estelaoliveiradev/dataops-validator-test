[project]
name = "conciliador-contabil"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "flask (>=3.0.0,<4.0.0)",
    "pandas (>=2.0.0,<4.0.0)",
    "plotly (>=5.18.0,<7.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "waitress (>=3.0.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = [".", "services", "utils"]
omit = [
    "test/*",
    "MASSA/*",
    "databricks/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "venv", ".venv", "databricks"]

