name: CD - Develop to Staging

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: 🧪 Testes & Build de Staging
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências e Testar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          PYTHONPATH=. pytest test/test_app.py

      - name: Definir Variáveis de Build
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=staging-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        if: github.repository_owner != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Publicação da Imagem de Staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:staging-latest
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: 🚀 Deploy no Ambiente de Staging / Dev
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dataops.internal/
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy em Staging
        run: |
          echo "============================================="
          echo "🚀 Iniciando Deploy no Ambiente de STAGING"
          echo "Artefato: ghcr.io/${{ github.repository }}:${{ needs.test-and-build.outputs.image_tag }}"
          echo "Branch: develop"
          echo "Commit: ${{ github.sha }}"
          echo "Data/Hora: $(date -u)"
          echo "============================================="
          
          # Aqui entram comandos específicos de deploy, como:
          # databricks bundle deploy --target staging
          # ou docker pull && docker run / kubectl apply / etc.
          echo "Deploy realizado com sucesso no ambiente de Staging!"

      - name: Registrar Resumo do Deploy
        run: |
          echo "## 🚀 Deploy em Staging Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** Staging / Desenvolvimento" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem:** \`${{ needs.test-and-build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Sucesso" >> $GITHUB_STEP_SUMMARY
