name: CD - Release to Homologation (UAT)

on:
  push:
    branches:
      - 'release/*'
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

jobs:
  test-and-build-rc:
    name: 📦 Validação & Build de Release Candidate
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.version.outputs.rc_version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Extrair Versão da Branch
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION=$(echo "$BRANCH_NAME" | sed 's/release\///;s/v//')
          RC_TAG="v${VERSION}-rc.${GITHUB_RUN_NUMBER}"
          echo "rc_version=${RC_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${RC_TAG}" >> $GITHUB_OUTPUT
          echo "Versão Release Candidate identificada: ${RC_TAG}"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências e Executar Testes de Regressão
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          PYTHONPATH=. pytest test/test_app.py --cov=. --cov-fail-under=70

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Publicação da Imagem Release Candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:rc-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-homologation:
    name: 🎯 Deploy em Homologação / UAT (SOX Validation)
    needs: test-and-build-rc
    runs-on: ubuntu-latest
    environment:
      name: homologation
      url: https://homolog.dataops.internal/
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy em Homologação
        run: |
          echo "============================================="
          echo "🎯 Iniciando Deploy no Ambiente de HOMOLOGAÇÃO (UAT)"
          echo "Versão RC: ${{ needs.test-and-build-rc.outputs.rc_version }}"
          echo "Imagem: ghcr.io/${{ github.repository }}:${{ needs.test-and-build-rc.outputs.image_tag }}"
          echo "Ambiente destinado para testes de aceitação e auditoria SOX"
          echo "Data/Hora: $(date -u)"
          echo "============================================="

      - name: Registrar Resumo do Deploy
        run: |
          echo "## 🎯 Deploy em Homologação / UAT Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** Homologação / Validação SOX" >> $GITHUB_STEP_SUMMARY
          echo "- **Versão RC:** \`${{ needs.test-and-build-rc.outputs.rc_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Pronto para Homologação e Assinatura de Release" >> $GITHUB_STEP_SUMMARY
