name: CI - Feature Branch Validation

on:
  push:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'feat/*'
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-feedback:
    name: ⚡ Fast Feedback (Linter & Testes Rápidos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da Feature Branch
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Checagem Rápida de Sintaxe & Linter (Ruff)
        run: |
          echo "::group::Executando Ruff..."
          ruff check . --select=E,F,W --ignore=E501
          echo "::endgroup::"
          python -m compileall -q .

      - name: Executar Testes Unitários
        env:
          PYTHONPATH: .
        run: |
          pytest test/test_app.py -v --tb=short

      - name: Resumo do Fast Feedback
        if: always()
        run: |
          echo "## ⚡ Validação da Branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Autor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Código sintaticamente correto e testes unitários aprovados." >> $GITHUB_STEP_SUMMARY
          echo "- **Próximo passo:** Quando finalizar o desenvolvimento, abra um Pull Request para a branch \`develop\`." >> $GITHUB_STEP_SUMMARY
